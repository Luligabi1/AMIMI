modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL="https://github.com/Luligabi1/AMIMI/issues/"
[[mods]]
    modId = "${mod_id}"
    version = "${mod_version}"
    displayName = "${mod_name}"
    displayURL = "dummy"
    logoFile="assets/${mod_id}/logo.png"
    credits="GregTech CEu Modern team, brachy"
    authors = "${mod_authors}"
    description = '''${mod_description}'''
[[mixins]]
    config = "${mod_id}.mixins.json"
[[accessTransformers]]
    file="${mod_id}-accesstransformer.cfg"
[[dependencies."${mod_id}"]]
    modId = "modern_industrialization"
    type = "required"
    versionRange = "${modern_industrialization_version_range}"
    ordering = "NONE"
    side = "BOTH"
[[dependencies."${mod_id}"]]
    modId = "modularui"
    type = "required"
    versionRange = "${modularui_version_range}"
    ordering = "NONE"
    side = "BOTH"
[[dependencies."${mod_id}"]]
    modId = "guideme"
    type = "required"
    versionRange = "${guideme_version_range}"
    ordering = "NONE"
    side = "BOTH"
[[dependencies."${mod_id}"]]
    modId = "neoforge"
    type = "required"
    versionRange = "${neo_version_range}"
    ordering = "NONE"
    side = "BOTH"
[[dependencies."${mod_id}"]]
    modId = "minecraft"
    type = "required"
    versionRange = "${minecraft_version_range}"
    ordering = "NONE"
    side = "BOTH"
