modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
#issueTrackerURL="https://change.me.to.your.issue.tracker.example.invalid/"
[[mods]]
    modId = "${mod_id}"
    version = "${mod_version}"
    displayName = "${mod_name}"
    displayURL = "dummy"
    #logoFile="tdmvmi.png"
    credits=""
    authors = "${mod_authors}"
    description = '''${mod_description}'''
[[mixins]]
    config = "${mod_id}.mixins.json"
[[accessTransformers]]
    file="${mod_id}-accesstransformer.cfg"
[[dependencies."${mod_id}"]]
    modId = "modern_industrialization"
    type = "required"
    versionRange = "${modern_industrialization_version_range}"
    ordering = "NONE"
    side = "BOTH"
[[dependencies."${mod_id}"]]
    modId = "modularui"
    type = "required"
    versionRange = "${modularui_version_range}"
    ordering = "NONE"
    side = "BOTH"
[[dependencies."${mod_id}"]]
    modId = "guideme"
    type = "required"
    versionRange = "${guideme_version_range}"
    ordering = "NONE"
    side = "BOTH"
[[dependencies."${mod_id}"]]
    modId = "neoforge"
    type = "required"
    versionRange = "${neo_version_range}"
    ordering = "NONE"
    side = "BOTH"
[[dependencies."${mod_id}"]]
